[project]
name = "steamfolio"
version = "0.1.0"
description = "Портфолио Steam: учёт инвестиций в предметы CS2"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
steamfolio = "steamfolio.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["steamfolio*"]
