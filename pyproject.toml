[project]
name = "steamfolio"
version = "0.1.0"
description = "Портфолио Steam: учёт инвестиций в предметы CS2"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
steamfolio = "steamfolio.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["steamfolio*"]

[tool.setuptools.package-data]
"steamfolio.web" = ["templates/*.html", "static/*"]
