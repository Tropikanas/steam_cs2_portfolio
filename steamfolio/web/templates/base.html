<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Портфолио Steam{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><path d='M8 22l5-6 4 3 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="/static/style.css?v=12">
</head>
<body>
{% if user %}
<header class="topbar">
  <div class="brand">Портфолио Steam</div>
  <nav class="tabs">
    <a href="/portfolio" class="{{ 'active' if tab == 'portfolio' }}">Портфолио</a>
    <a href="/orders" class="{{ 'active' if tab == 'orders' }}">Ордера</a>
    <a href="/stats" class="{{ 'active' if tab == 'stats' }}">Статистика</a>
    <a href="/journal" class="{{ 'active' if tab == 'journal' }}">Журнал операций</a>
  </nav>
  <div class="topbar-right">
    <span class="muted small" id="last-update"></span>
    <a href="/settings" class="settings-link {{ 'active' if tab == 'settings' }}" title="Настройки">⚙ Настройки</a>
    <form method="post" action="/logout"><button class="link">Выйти</button></form>
  </div>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
<div id="toasts"></div>
<script src="/static/app.js?v=12"></script>
{% block scripts %}{% endblock %}
</body>
</html>
